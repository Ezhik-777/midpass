services:
  midpass:
    build:
      context: .
      args:
        MIDPASS_VERSION: "1.0.4"
    image: midpass-bot:1.0.4
    container_name: midpass-bot
    restart: unless-stopped

    environment:
      MODE: cron
      INTERVAL_MINUTES: "60"
      TZ: "Europe/Berlin"

    volumes:
      - ./config.txt:/opt/midpass/config.txt:ro
      - ./data/logs:/opt/midpass/logs
      - ./data/temp:/opt/midpass/temp

    read_only: true
    tmpfs:
      - /tmp:size=16M

    # Healthy while the cron loop wrote a heartbeat within the last 2.5h
    # (interval is 60m + jitter; a missed heartbeat means the loop died).
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /opt/midpass/temp/heartbeat 2>/dev/null || echo 0) )) -lt 9000"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
